name: Sync periodicals to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      recent:
        description: "Recent issues per publication to inspect"
        required: false
        default: "2"
  schedule:
    - cron: "30 15 * * 5"
    - cron: "30 1 * * 6"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync to R2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/sync_periodicals.py \
            --config periodicals.json \
            --recent "${{ github.event.inputs.recent || '2' }}"

